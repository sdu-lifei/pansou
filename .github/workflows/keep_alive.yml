name: Keep Render Alive

on:
  schedule:
    # Runs every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send Heartbeat
        run: |
          if [ -z "${{ secrets.RENDER_URL }}" ]; then
            echo "Error: RENDER_URL secret is not set."
            exit 1
          fi
          curl -s -L "${{ secrets.RENDER_URL }}/api/health"
