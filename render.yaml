services:
  - type: web
    name: pansou
    runtime: python
    buildCommand: pip install -r pansou_py/requirements.txt
    startCommand: cd pansou_py && uvicorn pansou_py.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: .
      - key: CHANNELS
        sync: false
      - key: WECHAT_TOKEN
        sync: false
      - key: PROXY
        sync: false
    disk:
      name: cache
      mountPath: /opt/render/project/src/pansou_py/cache
      sizeGB: 1
